name: 缺陷报告
description: 报告可复现的错误或不安全行为。
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 摘要
      description: 描述错误行为及其用户可见影响。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 包含 commit、WSL/Ubuntu 版本、ROS 发行版、Gazebo 版本和相关模型/配置版本。
      placeholder: |
        Commit:
        主机 / WSL:
        Ubuntu:
        ROS:
        Gazebo:
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供复现问题的最小确定性步骤。
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 粘贴最短相关日志片段、测试失败、topic 样本或截图；移除密钥和私有音频。
      render: shell

  - type: dropdown
    id: safety
    attributes:
      label: 安全影响
      options:
        - 未观察到
        - 机器人未能停止或取消
        - 意外运动
        - 运动限制或 Gate 被绕过
        - 未知
    validations:
      required: true

  - type: textarea
    id: regression
    attributes:
      label: 最后已知正常版本
      description: 如为回归，指出最后正常的 commit 或 release。

  - type: checkboxes
    id: checks
    attributes:
      label: 报告者检查
      options:
        - label: 我已在干净 workspace 复现，或已说明无法复现的原因。
          required: true
        - label: 我已移除凭据、私有录音、地图、bag 和模型权重。
          required: true
