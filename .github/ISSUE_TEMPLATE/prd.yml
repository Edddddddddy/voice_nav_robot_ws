name: 产品需求文档
description: 记录决策完整的产品需求与交付边界。
title: "[PRD] "
labels:
  - type:prd
body:
  - type: markdown
    attributes:
      value: 保持 PRD 聚焦用户价值、明确决策和可独立验证的结果；GitHub Issue 是需求的唯一记录。
  - type: textarea
    id: issue_linkage
    attributes: {label: Issue 关联, description: 链接父 PRD、相关 Issue 或子 Task，并说明每个链接的意义。}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: 问题陈述, description: 什么用户或产品问题现在需要决策？}
    validations: {required: true}
  - type: textarea
    id: goal
    attributes: {label: 目标, description: 用一段简短文字说明可衡量的产品结果。}
    validations: {required: true}
  - type: textarea
    id: user_value
    attributes: {label: 用户价值, description: 谁受益，什么将变得可能或更安全？}
    validations: {required: true}
  - type: textarea
    id: requirements
    attributes: {label: 需求, description: 列出必须保持的产品规则和可观察行为。}
    validations: {required: true}
  - type: textarea
    id: decisions
    attributes: {label: 决策, description: 记录选定方案、重要阈值和被拒绝的替代方案。}
    validations: {required: true}
  - type: textarea
    id: out_of_scope
    attributes: {label: 范围外, description: 声明相关 Task 不得跨越的边界。}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: 验收标准, description: 使用可独立验证、可观察的结果。}
    validations: {required: true}
  - type: textarea
    id: rollback
    attributes: {label: 回滚, description: 说明如何回退变更及须保留的证据。}
    validations: {required: true}
  - type: dropdown
    id: interface_impact
    attributes:
      label: Stable Interface 影响
      description: 识别用户可见、ROS、配置、安全、时序或错误契约变更。
      options: [无 Stable Interface 变更, 向后兼容的 Stable Interface 变更, 破坏性 Stable Interface 变更, 尚未明确]
    validations: {required: true}
  - type: textarea
    id: risks
    attributes: {label: 风险与缓解, description: 覆盖安全、兼容性、数据、隐私、依赖和运维风险。}
    validations: {required: true}
  - type: textarea
    id: dependencies
    attributes: {label: 依赖, description: 链接前置 Issue、外部约束、审批，或写“无”。}
    validations: {required: true}
  - type: textarea
    id: verification
    attributes: {label: 验证计划, description: 写明精确自动化命令和有界人工证据。}
    validations: {required: true}
