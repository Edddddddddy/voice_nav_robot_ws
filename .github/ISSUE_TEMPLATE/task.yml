name: 任务
description: 定义一项可独立回滚的实现变更。
title: "[Task] "
labels:
  - type:task
body:
  - type: markdown
    attributes:
      value: |
        一个 Goal 恰好绑定一个 decision-complete Issue 和一个 Draft PR；Task 合并或结束后 Goal 停止，下一 Task 必须由 Manager 新建 Goal。一个 Task 只属于一个父 PRD、一个新的隔离 Worker 上下文、一个分支和一个 Draft PR。验收边界应保持小且可验证。
  - type: textarea
    id: issue_linkage
    attributes:
      label: Issue 关联
      description: 链接父 PRD、前置 Issue 和相关 Task。
      placeholder: "父 PRD: #\n前置阻塞: 无\n相关 Issue:"
    validations: {required: true}
  - type: textarea
    id: outcome
    attributes:
      label: 预期结果
      description: 完成后应具备什么可观察行为或仓库能力？
    validations: {required: true}
  - type: textarea
    id: context
    attributes: {label: 背景, description: 为什么现在有价值，当前什么行为促成此变更？}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: 范围内, description: 列出本 Task 可修改的具体行为、包、接口和文档。}
    validations: {required: true}
  - type: textarea
    id: non_goals
    attributes: {label: 非目标, description: 明确列出刻意不处理的边界。}
    validations: {required: true}
  - type: textarea
    id: acceptance
    attributes: {label: 验收标准, description: 使用可独立验证的结果，包含重要失败行为。}
    validations: {required: true}
  - type: textarea
    id: rollback
    attributes: {label: 回滚, description: 说明如何独立回滚此 Task。}
    validations: {required: true}
  - type: dropdown
    id: interface_impact
    attributes:
      label: Stable Interface 影响
      description: 是否改变用户可见、ROS、配置、安全、时序或错误契约？
      options: [无 Stable Interface 变更, 向后兼容的 Stable Interface 变更, 破坏性 Stable Interface 变更]
    validations: {required: true}
  - type: textarea
    id: risks
    attributes: {label: 风险与缓解, description: 覆盖安全、兼容性、数据、隐私、依赖和运维风险。}
    validations: {required: true}
  - type: textarea
    id: dependencies
    attributes: {label: 依赖, description: 链接前置 Issue、外部约束、审批，或写“无”。}
    validations: {required: true}
  - type: textarea
    id: verification
    attributes:
      label: 验证计划
      description: 写明精确聚焦命令、最终完整门禁和有界人工证据。
      placeholder: "聚焦: `python3 ...`\n最终: `bash scripts/verify.sh`"
    validations: {required: true}
