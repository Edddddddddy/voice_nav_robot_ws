name: Work item
description: Propose a scoped, testable change to VoiceNav Robot.
title: "[Work item] "
body:
  - type: markdown
    attributes:
      value: |
        Keep the change small enough for one short-lived branch. Link the matching
        `docs/work-items/` record when it already exists.

  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
      description: What observable capability or learning result should exist when this is done?
      placeholder: A user can...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this change useful now, and what current behavior or limitation motivates it?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: In scope
      description: List the concrete behavior, packages, and documentation this work item may change.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
      description: State what deliberately remains out of scope.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use independently verifiable outcomes, including important failure behavior.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: test_plan
    attributes:
      label: Verification plan
      description: Name the automated commands and any bounded manual evidence needed.
      placeholder: |
        - `bash scripts/verify.sh ...`
        - ...
    validations:
      required: true

  - type: textarea
    id: risks
    attributes:
      label: Risks and safety impact
      description: Cover motion, cancellation, timing, simulation cleanup, privacy, and dependency risks where relevant.
    validations:
      required: true

  - type: dropdown
    id: interface_change
    attributes:
      label: Stable Interface impact
      description: Does this change ROS names/types/QoS, TF ownership, configuration schemas, units, ordering, errors, or cancellation?
      options:
        - No stable Interface change
        - Backward-compatible Interface change
        - Breaking Interface change
        - Not yet known
    validations:
      required: true

  - type: textarea
    id: documentation
    attributes:
      label: Documentation impact
      description: Identify README, architecture, ADR, changelog, lesson, or learning-record updates.
    validations:
      required: true
