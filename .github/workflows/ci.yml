name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    name: required / ubuntu-24.04 / ros-jazzy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install governance tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl python3-yaml shellcheck

      - name: Lint shell scripts and GitHub Actions
        run: |
          set -euo pipefail
          export SHELLCHECK_OPTS="--exclude=SC1090,SC1091"
          shellcheck scripts/*.sh

          actionlint_version=1.7.12
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_dir="$(mktemp -d)"
          trap 'rm -rf -- "${actionlint_dir:?}"' EXIT
          curl --fail --location --show-error --silent \
            --output "${actionlint_dir}/${actionlint_archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${actionlint_dir}/${actionlint_archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${actionlint_dir}/${actionlint_archive}" \
            --directory "${actionlint_dir}"
          "${actionlint_dir}/actionlint" .github/workflows/*.yml

      - name: Run governance contract tests
        run: |
          python3 -m unittest \
            tests.test_ci_contract \
            tests.test_conventional_commits \
            tests.test_repository_contract \
            tests.test_skill_contract \
            --verbose
          python3 scripts/check_repository.py --root .

      - name: Check Conventional Commit subjects for pull request
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 scripts/check_conventional_commits.py \
            --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Reject main push without a safe commit range
        if: ${{ github.event_name == 'push' && github.event.before == '0000000000000000000000000000000000000000' }}
        run: |
          echo "main push 缺少安全的 before 提交范围，拒绝执行。" >&2
          exit 1

      - name: Check Conventional Commit subjects for main push
        if: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' }}
        run: |
          python3 scripts/check_conventional_commits.py \
            --range "${{ github.event.before }}..${{ github.sha }}"
