name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  ROS_DISTRO: jazzy

jobs:
  quality-gate:
    # Keep this name stable: it is the branch-protection required status check.
    name: required / ubuntu-24.04 / ros-jazzy
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install CI lint tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes curl shellcheck

      - name: Lint shell scripts and GitHub Actions
        run: |
          set -euo pipefail

          # ROS setup paths are selected at runtime, and install/setup.bash is
          # generated by colcon after this lint step.
          export SHELLCHECK_OPTS="--exclude=SC1090,SC1091"
          shellcheck scripts/*.sh

          actionlint_version=1.7.12
          actionlint_archive="actionlint_${actionlint_version}_linux_amd64.tar.gz"
          actionlint_url="https://github.com/rhysd/actionlint/releases/download/v${actionlint_version}/${actionlint_archive}"
          actionlint_sha256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          actionlint_dir="$(mktemp -d)"

          cleanup_actionlint() {
            rm -rf -- "${actionlint_dir:?}"
          }
          trap cleanup_actionlint EXIT

          curl --fail --location --show-error --silent \
            --output "${actionlint_dir}/${actionlint_archive}" \
            "${actionlint_url}"
          echo "${actionlint_sha256}  ${actionlint_dir}/${actionlint_archive}" \
            | sha256sum --check --strict
          tar \
            --extract \
            --gzip \
            --file "${actionlint_dir}/${actionlint_archive}" \
            --directory "${actionlint_dir}"

          "${actionlint_dir}/actionlint" .github/workflows/*.yml

      - name: Install ROS 2 Jazzy development environment
        run: |
          set -euo pipefail

          sudo apt-get install --yes locales software-properties-common
          sudo locale-gen en_US en_US.UTF-8
          sudo add-apt-repository --yes universe

          ros_apt_source=/tmp/ros2-apt-source_1.2.0.noble_all.deb
          curl --fail --location --show-error --silent \
            --output "${ros_apt_source}" \
            https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.2.0/ros2-apt-source_1.2.0.noble_all.deb
          echo "0804d9b13db770eb87019be414cd78378835228ad5fa801fc88758596dd8f7e5  ${ros_apt_source}" \
            | sha256sum --check --strict
          sudo dpkg --install "${ros_apt_source}"

          sudo apt-get update
          sudo apt-get install --yes \
            liburdfdom-tools \
            ros-dev-tools \
            ros-jazzy-ros-base

          if [[ ! -e /etc/ros/rosdep/sources.list.d/20-default.list ]]; then
            sudo rosdep init
          fi
          rosdep update --rosdistro "${ROS_DISTRO}"
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro "${ROS_DISTRO}" \
            -y

      - name: Run repository contract tests
        run: |
          set -euo pipefail
          # Some repository tests exercise the scoped colcon result reporter.
          source "/opt/ros/${ROS_DISTRO}/setup.bash"
          python3 -m unittest discover \
            --start-directory tests \
            --pattern 'test_*.py' \
            --verbose

      - name: Run canonical workspace verification
        run: bash scripts/verify.sh

      - name: Record resolved CI environment
        if: ${{ always() }}
        run: |
          set +e

          manifest="${RUNNER_TEMP}/voice-nav-toolchain.txt"
          {
            echo "VoiceNav Robot CI toolchain record"
            echo "Generated at: $(date --utc --iso-8601=seconds)"
            echo
            echo "Reproducibility note:"
            echo "GitHub's ubuntu-24.04 hosted runner image and the live Ubuntu / ROS apt indexes"
            echo "are mutable. This record captures the concrete environment resolved for this run;"
            echo "it does not make those upstream inputs immutable."
            echo
            echo "Runner:"
            echo "RUNNER_OS=${RUNNER_OS:-unknown}"
            echo "RUNNER_ARCH=${RUNNER_ARCH:-unknown}"
            echo "ImageOS=${ImageOS:-unknown}"
            echo "ImageVersion=${ImageVersion:-unknown}"
            uname -a
            echo
            echo "Operating system:"
            cat /etc/os-release
            echo
            echo "Core tools:"
            python3 --version
            git --version
            shellcheck --version
            echo "actionlint 1.7.12 (linux_amd64 archive sha256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8)"
            echo
            echo "ROS and Gazebo:"
            if [[ -f "/opt/ros/${ROS_DISTRO}/setup.bash" ]]; then
              # ROS setup scripts are not guaranteed to be nounset-safe.
              set +u
              source "/opt/ros/${ROS_DISTRO}/setup.bash"
              set -u
              echo "ROS_DISTRO=${ROS_DISTRO}"
              ros2 pkg prefix ros_environment
            else
              echo "ROS setup unavailable: /opt/ros/${ROS_DISTRO}/setup.bash"
            fi
            if command -v gz >/dev/null 2>&1; then
              gz sim --versions
            else
              echo "Gazebo CLI unavailable"
            fi
            echo
            echo "Installed ROS Jazzy and key apt packages:"
            dpkg-query \
              --show \
              --showformat='${binary:Package}\t${Version}\n' \
              'ros-jazzy-*' \
              curl \
              git \
              liburdfdom-tools \
              locales \
              python3 \
              ros2-apt-source \
              ros-dev-tools \
              shellcheck \
              software-properties-common \
              2>/dev/null \
              | sort
          } | tee "${manifest}"

          {
            echo "## Resolved CI environment"
            echo
            echo '```text'
            cat "${manifest}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          exit 0
