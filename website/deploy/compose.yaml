services:
  voice-nav-site:
    container_name: voice-nav-site
    image: nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
    ports:
      - 127.0.0.1:18081:80
    restart: unless-stopped
    volumes:
      - type: bind
        source: /opt/apps/voice_nav_site
        target: /srv/voice-nav
        read_only: true
      - type: bind
        source: /opt/apps/voice_nav_site/nginx/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    networks:
      voice-nav-public:
        aliases:
          - voice-nav-site

networks:
  voice-nav-public:
    external: true
    name: voice-nav-public
